name = "docusaurus-cloudflare-search"
main = "src/worker/worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# KV Namespace for storing search indexes
[[kv_namespaces]]
binding = "SEARCH_INDEXES"
id = "05ed5a66760349339b691ee6bec4ecb1" # Replace with your KV namespace ID

# Environment variables (optional)
[vars]
# ALLOWED_ORIGINS = "https://yourdomain.com,https://www.yourdomain.com"
# DEFAULT_TAG = "docs-default-current"  # Default search index tag (defaults to "docs-default-current" if not set)
